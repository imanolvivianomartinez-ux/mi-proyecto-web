{% extends "base.html" %}

{% block titulo %}
Equipos eliminados
{% endblock %}


{% block contenido %}

<h1 class="titulo-principal">
    ❌ Equipos eliminados
</h1>

<span class="en-vivo">
    <span class="punto-vivo"></span>
    En vivo
</span>


<div class="tarjetas" id="eliminados-cuerpo">
    {% include "_eliminados_tarjetas.html" %}
</div>

<script>
(function () {
    var cuerpo = document.getElementById("eliminados-cuerpo");
    var anterior = cuerpo.innerHTML;

    setInterval(function () {
        fetch("{{ url_for('eliminados_fragmento') }}")
            .then(function (respuesta) { return respuesta.text(); })
            .then(function (html) {
                if (html !== anterior) {
                    cuerpo.innerHTML = html;
                    anterior = html;
                }
            })
            .catch(function () {});
    }, 12000);
})();
</script>

{% endblock %}
