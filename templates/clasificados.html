{% extends "base.html" %}

{% block titulo %}
Tabla de clasificados
{% endblock %}


{% block contenido %}

<h1 class="titulo-principal">
    📊 Tabla de clasificados
</h1>

<span class="en-vivo">
    <span class="punto-vivo"></span>
    En vivo
</span>


<div class="tabla-contenedor">

<table>

    <thead>

        <tr>

            <th>Pos.</th>

            <th>Equipo</th>

            <th>PJ</th>

            <th>PG</th>

            <th>PE</th>

            <th>PP</th>

            <th>GF</th>

            <th>GC</th>

            <th>DG</th>

            <th>PTS</th>

        </tr>

    </thead>


    <tbody id="clasificados-cuerpo">
        {% include "_clasificados_filas.html" %}
    </tbody>

</table>

</div>

<script>
(function () {
    var cuerpo = document.getElementById("clasificados-cuerpo");
    var anterior = cuerpo.innerHTML;

    setInterval(function () {
        fetch("{{ url_for('clasificados_fragmento') }}")
            .then(function (respuesta) { return respuesta.text(); })
            .then(function (html) {
                if (html !== anterior) {
                    cuerpo.innerHTML = html;
                    anterior = html;
                }
            })
            .catch(function () {});
    }, 12000);
})();
</script>

{% endblock %}
