{% for equipo in eliminados %}

<div class="tarjeta eliminado">

    <h2>
        {{ equipo.nombre }}
    </h2>

    <p>
        <strong>Fase:</strong>
        {{ equipo.fase }}
    </p>

    <p>
        <strong>Motivo:</strong>
        {{ equipo.motivo }}
    </p>

    <p>
        <strong>Fecha:</strong>
        {{ equipo.fecha }}
    </p>

</div>

{% else %}

<div class="tarjeta">
    <h2>Todavía no hay equipos eliminados.</h2>
</div>

{% endfor %}
